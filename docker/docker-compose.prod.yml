version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: posmono-mongodb
    restart: unless-stopped
    environment:
      # Setting BOTH variables makes the official image add `--auth` to mongod and create
      # this user on the first boot with an empty volume. Without them the database is
      # reachable by anything on the `kuire` network. Values come from docker/.env.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?belum diset di docker/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?belum diset di docker/.env}
      # Not read by mongod itself: initdb scripts default to it, and OPS_RUNBOOK §3.2
      # reads it inside the container to scope `mongodump --db`. The app's database is
      # whatever docker/.env writes into MONGO_URI below.
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-posmono}
      # Least-privilege credentials for the app (created by docker/mongo-init on the
      # first boot). Root is kept for admin/backup; the app never uses it.
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?belum diset di docker/.env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?belum diset di docker/.env}
    volumes:
      - mongodb_data:/data/db
      # Initdb runs only while the volume is empty — see OPS_RUNBOOK §6c when the
      # volume already existed before the scoped user was introduced.
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    # Semua service di network `kuire` agar Caddy dan tools maintenance
    # (mongorestore via `--network kuire`, lihat docs/OPS_RUNBOOK.md) bisa
    # resolve `mongodb`. Network ini dibuat manual sekali: `docker network create kuire`.
    networks:
      - kuire
    healthcheck:
      # Must authenticate: an unauthenticated ping fails once `--auth` is on, so the
      # container would never become healthy and `app` would never start. `$$` escapes
      # the dollar so the container shell expands it, not compose.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: posmono-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - kuire
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: posmono-app
    restart: unless-stopped
    ports:
      # Hanya loopback VPS; akses publik lewat Caddy (port 80/443).
      - '127.0.0.1:3000:3000'
    env_file: ../backend/.env
    environment:
      # Overrides the (unauthenticated) MONGO_URI in backend/.env so the database password
      # lives in exactly one file: docker/.env. `environment` wins over `env_file`.
      # Uses the scoped app user (readWrite on MONGO_DATABASE), not the root account.
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-posmono}?authSource=admin
    networks:
      # `kuire` dipakai Caddy untuk resolve app:3000 (reverse proxy + TLS).
      - kuire
    volumes:
      # UPLOAD_DIR resolves relative to the compiled file, so uploads live under
      # backend/dist in the image — mount the volume there or product images are
      # lost every time the container is replaced.
      - uploads_data:/app/backend/dist/uploads
      # pino writes to <cwd>/logs (WORKDIR = /app).
      - logs_data:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mongodb_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  # Network operator: dibuat sekali di host (`docker network create kuire`) lalu
  # dipakai juga oleh docker/docker-compose.caddy.yml.
  kuire:
    external: true
    name: kuire
