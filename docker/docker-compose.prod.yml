version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: posmono-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: posmono-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: posmono-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: ../backend/.env
    volumes:
      # UPLOAD_DIR resolves relative to the compiled file, so uploads live under
      # backend/dist in the image — mount the volume there or product images are
      # lost every time the container is replaced.
      - uploads_data:/app/backend/dist/uploads
      # pino writes to <cwd>/logs (WORKDIR = /app).
      - logs_data:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mongodb_data:
  redis_data:
  uploads_data:
  logs_data:
