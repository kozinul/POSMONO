name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  NODE_VERSION: 20

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Sama persis dengan yang dijalankan manusia: satu proses per paket sehingga
      # vitest.config.ts tiap paket terpakai (pool 'forks', maxForks 1 untuk
      # mongodb-memory-server). Jalankan `pnpm vitest run` di root = tidak ada config
      # di root, jadi config backend/frontend terabaikan.
      # Tanpa service container: `MONGO_URI` sengaja tidak di-set sehingga
      # tests/helpers/db.ts memakai mongodb-memory-server (binary di-cache
      # postinstall). Jangan tambahkan service `mongodb`/`redis` kembali —
      # redis tidak dipakai backend, dan Mongo service hanya memindahkan
      # dependensi yang sudah ditangani memory-server.
      - name: Run tests
        run: pnpm run test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `lint` = `tsc --noEmit` per paket (repo tidak memakai ESLint).
      # Backend punya project reference ke shared, jadi shared harus dibangun dulu —
      # script `lint` backend sudah melakukannya sendiri (`tsc --build ../shared`).
      - name: Type check
        run: pnpm run lint

      # Anti-regresi kompleksitas kode (TECH_DEBT_PLAN T9)
      - name: Complexity budget
        run: pnpm run budget

      # Anti-regresi dead code / dependency tak terpakai (knip).
      # Lihat `knip.json`; simbol yang sengaja diekspor meski tak pernah
      # diimpor ditandai `@internal` di sumbernya (knip default: tags: ["-internal"]).
      - name: Dead code (knip)
        run: pnpm run knip

  docker:
    # Publish on master pushes and on `v*` tags (repo default branch = master).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      # QEMU diperlukan untuk build lintas-arch (arm64) di runner amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # `:latest` hanya di default branch; tag `v*` menghasilkan `:1.2.3` + `:1.2`.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/posmono
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
