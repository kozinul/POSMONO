name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_DATABASE: posmono_test
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      MONGO_URI: mongodb://localhost:27017/posmono_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Sama persis dengan yang dijalankan manusia: satu proses per paket sehingga
      # vitest.config.ts tiap paket terpakai (pool 'forks', maxForks 1 untuk
      # mongodb-memory-server). Jalankan `pnpm vitest run` di root = tidak ada config
      # di root, jadi config backend/frontend terabaikan.
      - name: Run tests
        run: pnpm run test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `lint` = `tsc --noEmit` per paket (repo tidak memakai ESLint).
      # Backend punya project reference ke shared, jadi shared harus dibangun dulu —
      # script `lint` backend sudah melakukannya sendiri (`tsc --build ../shared`).
      - name: Type check
        run: pnpm run lint

      # Anti-regresi kompleksitas kode (TECH_DEBT_PLAN T9)
      - name: Complexity budget
        run: pnpm run budget

  docker:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/posmono:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
